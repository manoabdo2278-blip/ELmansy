<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - ELmansy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px #ddd;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎓 ELmansy</h1>
    <h2>إنشاء حساب</h2>

    <input type="text" id="name" placeholder="الاسم">

    <input type="tel" id="phone" placeholder="رقم الهاتف">

    <input type="email" id="email" placeholder="البريد الإلكتروني">

    <input type="password" id="password" placeholder="كلمة السر">

    <input type="password" id="confirmPassword"
           placeholder="تأكيد كلمة السر">

    <button onclick="registerUser()">إنشاء الحساب</button>

    <p id="message"></p>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.3.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.3.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc
} from
"https://www.gstatic.com/firebasejs/12.3.1/firebase-firestore.js";


/* ضع بيانات Firebase هنا */

const firebaseConfig = {
    apiKey: "ضع_API_KEY_هنا",
    authDomain: "ضع_AUTH_DOMAIN_هنا",
    projectId: "ضع_PROJECT_ID_هنا",
    storageBucket: "ضع_STORAGE_BUCKET_هنا",
    messagingSenderId: "ضع_MESSAGING_SENDER_ID_هنا",
    appId: "ضع_APP_ID_هنا"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


window.registerUser = async function () {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (!name || !phone || !email || !password || !confirmPassword) {

        message.innerText =
            "من فضلك املأ جميع البيانات";

        return;
    }


    if (password !== confirmPassword) {

        message.innerText =
            "كلمتا السر غير متطابقتين ❌";

        return;
    }


    try {

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        const uid =
            userCredential.user.uid;


        await setDoc(
            doc(db, "users", uid),
            {
                name: name,
                phone: phone,
                email: email
            }
        );


        message.innerText =
            "تم إنشاء الحساب بنجاح ✅";

    } catch (error) {

        message.innerText =
            "حدث خطأ: " + error.message;
    }

};

</script>

</body>
</html>
