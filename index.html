<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>امتحان تانيه باكلوريا | مستر محمد المنسي</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f4fa;
  color: #172033;
  font-family: Tahoma, Arial, sans-serif;
}

header {
  background: linear-gradient(135deg,#101b40,#263d82,#405bb0);
  color: white;
  padding: 35px 15px;
  text-align: center;
  box-shadow: 0 5px 20px #17255430;
}

header h1 {
  font-size: 27px;
  margin: 0 0 12px;
}

header p {
  color: #dce5ff;
  margin: 8px;
  font-size: 16px;
}

.teacher-name {
  margin-top: 15px;
  padding: 13px 20px;
  display: inline-block;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  color: white;
}

main {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 14px 40px;
}

.panel,.question,.result {
  background: white;
  border: 1px solid #e4e8f0;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 17px;
  box-shadow: 0 5px 18px #14213d0a;
}

.topline {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: #667085;
  font-size: 14px;
}

.track {
  height: 9px;
  background: #e9edf6;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 13px;
}

.fill {
  height: 100%;
  width: 0;
  background: #405ac0;
  transition: .3s;
}

.qtitle {
  font-weight: bold;
  line-height: 1.9;
  font-size: 17px;
  margin-bottom: 15px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid #e4e8f0;
  border-radius: 11px;
  padding: 13px;
  margin: 10px 0;
  cursor: pointer;
  line-height: 1.8;
  transition: .2s;
}

.opt:hover {
  border-color: #405ac0;
  background: #f5f7ff;
}

.opt input {
  margin-top: 6px;
  accent-color: #253b80;
  transform: scale(1.15);
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #253b80;
  color: white;
}

.secondary {
  background: #e7eaf2;
  color: #26324a;
}

button:hover {
  opacity: .9;
}

.note {
  color: #667085;
  font-size: 13px;
  line-height: 1.9;
}

.hidden {
  display: none;
}

.score {
  font-size: 35px;
  font-weight: bold;
  color: #253b80;
}

.review {
  border-top: 1px solid #e4e8f0;
  padding: 14px 0;
  line-height: 2;
}

.correct {
  color: #16834a;
  font-weight: bold;
}

.wrong {
  color: #c73535;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #667085;
  font-size: 13px;
  padding: 20px;
}

@media(max-width:520px) {
  header h1 {
    font-size: 22px;
  }

  .panel,.question,.result {
    padding: 15px;
  }

  .qtitle {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>

  <h1>امتحان تانيه باكلوريا</h1>

  <p>مادة التاريخ - الوحدة الأولى</p>

  <div class="teacher-name">
    إنشاء وتصميم مستر محمد المنسي
  </div>

</header>

<main>

<section class="panel">

  <div class="topline">
    <span>عدد الأسئلة: 15</span>
    <span id="progressText">
      تمت الإجابة عن 0 من 15
    </span>
  </div>

  <div class="track">
    <div class="fill" id="progress"></div>
  </div>

  <p class="note">
    اختر الإجابة الصحيحة لكل سؤال.
    لن تظهر الإجابات الصحيحة إلا بعد إنهاء الامتحان.
  </p>

</section>

<div id="quiz"></div>

<div class="actions" id="controls">

  <button class="primary" id="submit">
    إنهاء وتصحيح الامتحان
  </button>

  <button class="secondary" id="clear">
    مسح الإجابات
  </button>

</div>

<section class="result hidden" id="result"></section>

</main>

<div class="footer">
  جميع الحقوق محفوظة © مستر محمد المنسي
</div>

<script>

// =================================
// مفتاح الإجابات والأسئلة
// =================================

const questions = [

{
q:"ما الفرق الجوهري بين المجتمع والدولة؟",
o:["الحيز الجغرافي","السلطة المنظمة","التجانس البشري","الموارد الطبيعية"],
a:1
},

{
q:"استلزمت عملية إدارة مياه نهر النيل وتنظيم الري في مصر القديمة حتمية ظهور:",
o:["الحدود السياسية","الجيش النظامي","السلطة المركزية","التوسع الخارجي"],
a:2
},

{
q:"ينص الدستور على أن مصر دولة ذات سيادة موحدة لا تقبل التجزئة. يعبر هذا النص بالأساس عن مفهوم:",
o:["القوة العسكرية","التجانس الثقافي","التضامن الاجتماعي","السيادة المطلقة"],
a:3
},

{
q:"بدأت حرب التحرير بتوسع الملك سقنن رع شمالاً حتى القوصية، ويعكس هذا الإجراء مبدأ مهماً وهو:",
o:["أسلوب الحرب الخاطفة لحسم المعركة في يوم واحد","بناء القوة وتوسيع نفوذ المقاومة بالتدريج والتخطيط","الدفاع المستميت دون تحريك خطوط القتال","عقد تحالفات عسكرية مع القوى الخارجية"],
a:1
},

{
q:"يرجع المؤرخون سقوط مصر في أيدي الفرس عام 525 ق.م في المقام الأول إلى:",
o:["الاضطراب السياسي والصراع الداخلي","استسلام الملك أحمس الأول","كثرة العجلات الحربية لدى الفرس","التحالف الفارسي الإغريقي"],
a:0
},

{
q:"تحول مصر عام 641م من الحكم البيزنطي إلى الولاية الإسلامية يمثل تغيراً في:",
o:["البنية السياسية والإدارية","التركيبة الديموغرافية فوراً","الهوية الدينية فقط","النظام الاقتصادي الزراعي"],
a:0
},

{
q:"اتخاذ أحمد بن طولون من مدينة القطائع مقراً للحكم يعبر عن بداية مرحلة:",
o:["الاستقلال السياسي عن العباسيين","الاندفاع نحو البحر المتوسط","التبعية المطلقة لدمشق","التحول لولاية عثمانية"],
a:0
},

{
q:"اتجاه محمد علي لبناء جيش نظامي حديث وتطوير الإدارة هدف أساساً إلى:",
o:["الانضمام للحلف الأوروبي","تحويل مصر لكيان سياسي أكثر استقلالاً","إلغاء البعثات العلمية للخارج","تثبيت التبعية المطلقة للسلطان"],
a:1
},

{
q:"حصول الخديوي إسماعيل على تغيير نظام وراثة الحكم في أكبر أبنائه ترتب عليه:",
o:["إنهاء أزمة الديون الخارجية فوراً","وضع سياسي أكثر استقلالاً داخلياً","إلغاء الامتيازات الأجنبية","خروج مصر من مظلة القناطر الخيرية"],
a:1
},

{
q:"تمثلت الطبقة الدنيا في الهرم الاجتماعي المصري أواخر القرن 19 في:",
o:["كبار التجار والمحامين","الفلاحين المعدمين والعمال الموسميين","صغار التجار والحرفيين","أصحاب المصانع والرأسماليين"],
a:1
},

{
q:"المسجد الكبير في عواصم الإسلام لم يكن مجرد دار للعبادة، بل جامعة مركزية. يتفق ذلك مع أحوال مصر في العصر الوسيط من حيث:",
o:["شمولية أدوار المؤسسات الدينية","اقتصار التعليم على الفسطاط","التنافس بين العلوم الشرعية","ملاحقة العلماء والمراكز العلمية"],
a:0
},

{
q:"أي مما يلي يعد دليلاً على تحقيق مقولة أن ثورة 1919 هزت وعي الأمة؟",
o:["تصفية الوجود البريطاني","الإرادة الشعبية الوطنية","الاستعانة بالقوى الخارجية","إزالة الفوارق الطائفية والطبقية"],
a:1
},

{
q:"ما الركن الأساسي الذي يضمن تنظيم العلاقة بين الشعب والحيز الجغرافي ويكسب الدولة قدرتها على فرض إرادتها؟",
o:["الإقامة الدائمة والمستقرة للشعب","امتلاك حيز جغرافي واسع ومحدد","وجود سلطة منظمة تمتلك السيادة","التجانس الثقافي بين أفراد الشعب"],
a:2
},

{
q:"أكد الدستور على تنوع انتماءات مصر العربية والأفريقية والآسيوية والإسلامية. يعكس هذا التنوع:",
o:["اتساع دوائر التأثير والارتباط الخارجي","اقتصار الدور المصري على الجانب الثقافي","تغليب الهوية القارية على باقي الهويات","التناقض بين الانتماء المحلي والدولي"],
a:0
},

{
q:"تعبر الصورة التي تضم الشعب والحيز الجغرافي والسلطة والسيادة عن:",
o:["المقومات المشتركة بين الأمة والدولة","المظاهر المؤسسية لإدارة الشؤون الداخلية","أهمية تطبيق مبدأ الفصل بين السلطات","الأسس الضرورية لإعلان ميلاد وحدة سياسية"],
a:3
}

];

// =================================
// عرض الأسئلة للطالب
// =================================

const quiz = document.getElementById("quiz");

questions.forEach((item,i)=>{

  const section = document.createElement("section");
  section.className = "question";

  const title = document.createElement("p");
  title.className = "qtitle";

  title.textContent =
    `السؤال ${i+1}: ${item.q}`;

  section.appendChild(title);

  item.o.forEach((option,j)=>{

    const label = document.createElement("label");
    label.className = "opt";

    const radio = document.createElement("input");

    radio.type = "radio";
    radio.name = `q${i}`;
    radio.value = j;

    radio.addEventListener("change",updateProgress);

    const span = document.createElement("span");
    span.textContent = option;

    label.append(radio,span);

    section.appendChild(label);

  });

  quiz.appendChild(section);

});

// =================================
// تحديث شريط التقدم
// =================================

function updateProgress(){

  const count = questions.filter((q,i)=>
    document.querySelector(
      `input[name="q${i}"]:checked`
    )
  ).length;

  document.getElementById("progressText").textContent =
    `تمت الإجابة عن ${count} من ${questions.length}`;

  document.getElementById("progress").style.width =
    (count/questions.length*100)+"%";

}

// =================================
// تصحيح الامتحان
// =================================

document.getElementById("submit").addEventListener("click",()=>{

  const unanswered = questions.filter((q,i)=>
    !document.querySelector(
      `input[name="q${i}"]:checked`
    )
  ).length;

  if(unanswered && !confirm(
    `يوجد ${unanswered} سؤال بدون إجابة. هل تريد التصحيح؟`
  )) return;

  let score = 0;
  let review = "";

  questions.forEach((q,i)=>{

    const chosen = document.querySelector(
      `input[name="q${i}"]:checked`
    );

    const val = chosen ? Number(chosen.value) : -1;

    const ok = val === q.a;

    if(ok) score++;

    review += `

      <div class="review">

        <strong>السؤال ${i+1}</strong>

        <br>

        ${ok
          ? '<span class="correct">إجابة صحيحة ✓</span>'
          : '<span class="wrong">إجابة غير صحيحة ✗</span>'
        }

        <br>

        إجابتك:
        ${val<0 ? "لم تتم الإجابة" : q.o[val]}

        <br>

        الإجابة الصحيحة:

        <span class="correct">
          ${q.o[q.a]}
        </span>

      </div>

    `;

  });

  const result = document.getElementById("result");

  result.innerHTML = `

    <h2>نتيجة امتحان تانيه باكلوريا</h2>

    <div class="score">
      ${score} / ${questions.length}
    </div>

    <p>
      النسبة المئوية:
      ${Math.round(score/questions.length*100)}%
    </p>

    <h3>مراجعة الإجابات</h3>

    ${review}

    <p>
      إنشاء وتصميم مستر محمد المنسي
    </p>

    <button class="primary" id="retry">
      إعادة الامتحان
    </button>

  `;

  result.classList.remove("hidden");

  document.getElementById("controls").classList.add("hidden");

  result.scrollIntoView({behavior:"smooth"});

  document.getElementById("retry").addEventListener("click",()=>{
    location.reload();
  });

});

// =================================
// مسح الإجابات
// =================================

document.getElementById("clear").addEventListener("click",()=>{

  if(confirm("هل تريد مسح جميع الإجابات؟")){

    document.querySelectorAll('input[type="radio"]')
      .forEach(x=>x.checked=false);

    updateProgress();

  }

});

</script>

</body>
</html>
