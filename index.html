<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELmansy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #2563eb;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.welcome {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px #ddd;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px #ddd;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.login {
    margin-top: 25px;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>🎓 ELmansy</h1>
    <p>منصتك التعليمية</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>أهلاً بيك في منصة ELmansy 👋</h2>
        <p>محاضراتك ومجموعاتك التعليمية في مكان واحد</p>
        <button onclick="welcome()">ابدأ الآن</button>
    </div>

    <div class="cards">

        <div class="card">
            <h2>📚</h2>
            <h3>محاضراتي</h3>
            <p>الوصول إلى جميع المحاضرات</p>
            <button onclick="showMessage('المحاضرات')">دخول</button>
        </div>

        <div class="card">
            <h2>👥</h2>
            <h3>مجموعاتي</h3>
            <p>شاهد مجموعاتك التعليمية</p>
            <button onclick="showMessage('المجموعات')">دخول</button>
        </div>

        <div class="card">
            <h2>🎥</h2>
            <h3>الفيديوهات</h3>
            <p>شاهد المحاضرات المسجلة</p>
            <iframe width="100%" height="400" src="https://www.youtube.com/embed/a91r5PbKl1o" title="فيديو ELmansy" frameborder="0" allowfullscreen></iframe>س
            <button onclick="showMessage('الفيديوهات')">مشاهدة</button>
        </div>

    </div>

    <div class="login">
        <h2>🔐 تسجيل الدخول</h2>

        <input type="email" id="email" placeholder="البريد الإلكتروني">

        <input type="password" id="password" placeholder="كلمة المرور">

        <button onclick="login()">تسجيل الدخول</button>

        <p id="result"></p>
    </div>

</div>

<script>

function welcome() {
    alert("أهلاً بيك في منصة ELmansy ❤️");
}

function showMessage(section) {
    alert("قسم " + section + " هيتم تجهيزه قريباً 📚");
}

function login() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (email === "" || password === "") {
        document.getElementById("result").innerText =
            "من فضلك اكتب البريد الإلكتروني وكلمة المرور";
        return;
    }

    document.getElementById("result").innerText =
        "تم تسجيل الدخول بنجاح ✅";
}

</script>

</body>
</html>
